# Colors
$active_border_col = 0xff00ffff
$inactive_border_col = 0xff006666
$shadow_col = 0x66001a1a

# Decoration personality: rounded frost
$rounding = 14
$border_size = 2
$gaps_in = 6
$gaps_out = 16
$shadow_range = 25
$shadow_render_power = 3
$blur_size = 5
$blur_passes = 3

# animation profile: default (classic Hyprland feel)
animations {
    enabled = yes
    bezier = themeCurve, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 5, themeCurve
    animation = windowsOut, 1, 5, themeCurve, popin 80%
    animation = border, 1, 10, themeCurve
    animation = borderangle, 1, 8, themeCurve
    animation = fade, 1, 7, themeCurve
    animation = workspaces, 1, 6, themeCurve
}

# Cursor theme — picked up at Hyprland start so it persists across reboots
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
