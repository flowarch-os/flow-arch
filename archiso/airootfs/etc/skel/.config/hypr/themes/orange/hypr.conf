# Colors
$active_border_col = 0xffff8800
$inactive_border_col = 0xff663300
$shadow_col = 0x66331100

# Decoration personality: warm balanced
$rounding = 8
$border_size = 2
$gaps_in = 5
$gaps_out = 14
$shadow_range = 25
$shadow_render_power = 3
$blur_size = 5
$blur_passes = 3

# animation profile: fast (quick with slight overshoot)
animations {
    enabled = yes
    bezier = themeCurve, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 4, themeCurve
    animation = windowsOut, 1, 4, themeCurve, popin 80%
    animation = border, 1, 6, themeCurve
    animation = borderangle, 1, 5, themeCurve
    animation = fade, 1, 4, themeCurve
    animation = workspaces, 1, 4, themeCurve
}

# Cursor theme — picked up at Hyprland start so it persists across reboots
env = XCURSOR_THEME,Bibata-Modern-Amber
env = HYPRCURSOR_THEME,Bibata-Modern-Amber
