# Kitty Configuration

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

font_size 12.0

# Window layout
window_padding_width 10
hide_window_decorations yes
confirm_os_window_close 0

# Color scheme — symlinked per active Hyprland theme by switch_theme.sh.
# Update via ~/.config/hypr/scripts/update_kitty_themes.py
background_opacity 0.95
include colors.conf
url_style curly

# Performance
sync_to_monitor yes
enable_audio_bell no
