# Colors
$active_border_col = 0xffaa00ff
$inactive_border_col = 0xff220033
$shadow_col = 0x66110022

# Decoration personality: dreamy round
$rounding = 20
$border_size = 2
$gaps_in = 8
$gaps_out = 20
$shadow_range = 30
$shadow_render_power = 4
$blur_size = 6
$blur_passes = 4

# animation profile: bouncy (overshoot + settle)
animations {
    enabled = yes
    bezier = themeCurve, 0.34, 1.56, 0.64, 1
    animation = windows, 1, 6, themeCurve
    animation = windowsOut, 1, 6, themeCurve, popin 90%
    animation = border, 1, 10, themeCurve
    animation = borderangle, 1, 8, themeCurve
    animation = fade, 1, 7, themeCurve
    animation = workspaces, 1, 6, themeCurve
}

# Cursor theme — picked up at Hyprland start so it persists across reboots
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
