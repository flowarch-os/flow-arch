# Colors
$active_border_col = 0xffff0000
$inactive_border_col = 0xff550000
$shadow_col = 0x88ff2222

# Decoration personality: aggressive sharp
$rounding = 4
$border_size = 3
$gaps_in = 4
$gaps_out = 12
$shadow_range = 25
$shadow_render_power = 2
$blur_size = 4
$blur_passes = 2

# animation profile: snappy (sharp, no overshoot)
animations {
    enabled = yes
    bezier = themeCurve, 0.6, 0, 0.4, 1
    animation = windows, 1, 3, themeCurve
    animation = windowsOut, 1, 3, themeCurve, popin 70%
    animation = border, 1, 5, themeCurve
    animation = borderangle, 1, 4, themeCurve
    animation = fade, 1, 3, themeCurve
    animation = workspaces, 1, 3, themeCurve
}

# Cursor theme — picked up at Hyprland start so it persists across reboots
env = XCURSOR_THEME,Bibata-Modern-Amber
env = HYPRCURSOR_THEME,Bibata-Modern-Amber
