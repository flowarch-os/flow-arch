# Colors
$active_border_col = 0xff5fbaff
$inactive_border_col = 0xff1a3a5e
$shadow_col = 0x44001028

# Decoration personality: minimal, thin border, subtle shadow
$rounding = 6
$border_size = 1
$gaps_in = 6
$gaps_out = 18
$shadow_range = 15
$shadow_render_power = 3
$blur_size = 4
$blur_passes = 3

# animation profile: subtle (minimal, soft, near-imperceptible)
animations {
    enabled = yes
    bezier = themeCurve, 0.25, 0.46, 0.45, 0.94
    animation = windows, 1, 4, themeCurve
    animation = windowsOut, 1, 4, themeCurve, popin 95%
    animation = border, 1, 7, themeCurve
    animation = borderangle, 1, 6, themeCurve
    animation = fade, 1, 5, themeCurve
    animation = workspaces, 1, 4, themeCurve
}

# Cursor theme — picked up at Hyprland start so it persists across reboots
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
