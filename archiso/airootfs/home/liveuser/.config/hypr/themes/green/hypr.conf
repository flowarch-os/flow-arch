# Colors
$active_border_col = 0xff00ffaa
$inactive_border_col = 0xff003322
$shadow_col = 0x66001a08

# Decoration personality: leafy, soft
$rounding = 16
$border_size = 2
$gaps_in = 7
$gaps_out = 20
$shadow_range = 25
$shadow_render_power = 4
$blur_size = 5
$blur_passes = 4

# animation profile: smooth (long graceful ease-out)
animations {
    enabled = yes
    bezier = themeCurve, 0.16, 1, 0.3, 1
    animation = windows, 1, 8, themeCurve, slide
    animation = windowsOut, 1, 8, themeCurve, slide
    animation = border, 1, 14, themeCurve
    animation = borderangle, 1, 12, themeCurve
    animation = fade, 1, 10, themeCurve
    animation = workspaces, 1, 9, themeCurve
}

# Cursor theme — picked up at Hyprland start so it persists across reboots
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_THEME,Bibata-Modern-Classic
