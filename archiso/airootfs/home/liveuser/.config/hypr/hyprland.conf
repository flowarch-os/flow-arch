# monitors
monitor=,preferred,auto,auto

# programs
$terminal = kitty
$fileManager = thunar
$menu = /home/malek/.config/hypr/scripts/app_picker.py

# autostart
exec-once = /home/malek/.config/hypr/scripts/autostart.sh

# environment
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24


env = QT_QPA_PLATFORMTHEME,qt5ct

# look and feel
# Per-theme defaults — overridden by the active theme.conf if it sets these vars.
# (Sourcing theme.conf below redefines whichever vars the theme provides.)
$rounding = 10
$border_size = 2
$gaps_in = 5
$gaps_out = 15
$shadow_range = 20
$shadow_render_power = 3
$blur_size = 5
$blur_passes = 3
source = ~/.config/hypr/theme.conf

general {
    gaps_in = $gaps_in
    gaps_out = $gaps_out
    border_size = $border_size
    col.active_border = $active_border_col
    col.inactive_border = $inactive_border_col
    layout = dwindle
    resize_on_border = false
    allow_tearing = false
}

decoration {
    rounding = $rounding
    active_opacity = 0.95
    inactive_opacity = 0.85

    shadow {
        enabled = true
        range = $shadow_range
        render_power = $shadow_render_power
        color = $shadow_col
    }

    blur {
        enabled = true
        size = $blur_size
        passes = $blur_passes
        new_optimizations = true
        ignore_opacity = true
    }
}

# animations {} block is provided per-theme via theme.conf — each theme
# defines its own bezier + animation timings for a distinct interaction feel.

dwindle {
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# input
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = false
    }
}

# keybindings
source = ~/.config/hypr/keybindings.conf

### Window rules ###
# windowrulev2 = suppressevent maximize, class:.*
##Old: windowrulev2 = float, class:^(kitty)$
# New: windowrule = match:class ^(kitty)$, float, on 

# clipboard manager (custom QML, replaces wofi)
windowrule = match:class ^clipboard-manager$, float 1
windowrule = match:class ^clipboard-manager$, pin 1
windowrule = match:class ^clipboard-manager$, border_size 0
windowrule = match:class ^clipboard-manager$, no_shadow 1

# pavucontrol
windowrule = match:class ^org.pulseaudio.pavucontrol$, float 1
windowrule = match:class ^org.pulseaudio.pavucontrol$, center 1
windowrule = match:class ^org.pulseaudio.pavucontrol$, size 800 600

# blueman-manager
windowrule = match:class ^blueman-manager$, float 1
windowrule = match:class ^blueman-manager$, center 1
windowrule = match:class ^blueman-manager$, size 800 600

# check_in (QML Popup)
windowrule = match:title ^Check-In$, float 1
windowrule = match:title ^Check-In$, center 1
windowrule = match:title ^Check-In$, size 600 350
windowrule = match:title ^Check-In$, animation none
windowrule = match:title ^Check-In$, pin 1

# Session Feedback (QML Popup)
windowrule = match:title ^Session Feedback$, float 1
windowrule = match:title ^Session Feedback$, center 1
windowrule = match:title ^Session Feedback$, size 500 450
windowrule = match:title ^Session Feedback$, animation none
windowrule = match:title ^Session Feedback$, pin 1

# App Picker (custom QML launcher, replaces wofi)
windowrule = match:title ^App Picker$, float 1
windowrule = match:title ^App Picker$, center 1
windowrule = match:title ^App Picker$, size 920 620
windowrule = match:title ^App Picker$, animation none
windowrule = match:title ^App Picker$, pin 1
windowrule = match:title ^App Picker$, border_size 0
windowrule = match:title ^App Picker$, no_shadow 1
windowrule = match:title ^App Picker$, stay_focused 1

# Hypr Package Manager (GTK4)
windowrule = match:class ^com.malek.pkgmgr$, float 1
windowrule = match:class ^com.malek.pkgmgr$, center 1
windowrule = match:class ^com.malek.pkgmgr$, size 1000 700
windowrule = match:class ^com.malek.pkgmgr$, pin 1

# Mouse
# no_hardware_cursors = true 
cursor {
    hide_on_key_press = false
    inactive_timeout = 0
}
env = XCURSOR_SIZE,32
env = HYPRCURSOR_SIZE,32
input {
    touchpad {
        disable_while_typing = false
    }
}

xwayland {
  force_zero_scaling = true
}
